server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: paysonic-tollops-backend

  profiles:
    active: mysql

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  mvc:
    format:
      date-time: iso

---
# MySQL Profile (Default)
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/paysonic_tollops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
# In-Memory H2 Profile (Zero-Config fallback — no MySQL needed)
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:paysonic_tollops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      # Disable schema.sql for H2 — Hibernate create-drop handles DDL instead
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
